services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: sh -c "pnpm install && pnpm dev"
    env_file:
      - .env
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
      - "3001:3001"
      - "4000:4000"
    volumes:
      - .:/workspace
      - workspace_node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store

volumes:
  workspace_node_modules:
  pnpm_store:
